name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/twitter-thread-extractor-RclyN
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages serves a project repo at https://<owner>.github.io/<repo>/
          # github.repository is "<owner>/<repo>"; split on / to get the repo name.
          META_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/x-graphql-meta.json
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
